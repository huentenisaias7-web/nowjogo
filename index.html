<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9ed">
  <title>Mis Tablas | Mi aventura</title>
  <link rel="stylesheet" href="CSS/styles.css">
  <script src="JS/app.js" defer></script>
</head>
<body class="app-page" data-page="app">
  <div id="app" class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" data-nav="home" aria-label="Ir al inicio"><span class="brand-mark">×</span><span>mis tablas<span class="brand-dot">.</span></span></a>
      <div class="topbar-right">
        <div class="streak-pill"><span>🔥</span><strong id="header-streak">0</strong><span class="streak-label">días</span></div>
        <div class="student-chip"><span class="student-avatar" id="header-avatar">🦊</span><span id="header-name">Explorador</span></div>
        <button class="icon-button audio-control" id="sound-toggle" type="button" data-audio-toggle="sound" aria-label="Desactivar sonidos" aria-pressed="true" title="Sonidos activados">🔊</button>
        <button class="icon-button audio-control" id="voice-toggle" type="button" data-audio-toggle="voice" aria-label="Desactivar guía de voz" aria-pressed="true" title="Guía de voz activada">🗣️</button>
        <button class="icon-button" id="logout-button" type="button" aria-label="Cambiar estudiante" title="Cambiar estudiante">↪</button>
      </div>
    </header>
    <div class="app-body">
      <aside class="sidebar" aria-label="Navegación principal"><nav id="side-nav"></nav><div class="sidebar-tip"><span>💡</span><p>¡Equivocarse es parte de aprender!</p></div><div class="sidebar-credit">MIS TABLAS <span>•</span> 4° BÁSICO</div></aside>
      <main class="main-content" id="main-content" tabindex="-1"></main>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Navegación móvil"></nav>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </div>
</body>
</html>
